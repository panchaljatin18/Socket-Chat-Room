<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App UI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .container {
      display: flex;
      height: 100vh;
      height: 100dvh;
    }

    /* SIDEBAR */

    .sidebar {
      width: 320px;
      background: #111827;
      border-right: 1px solid #1f2937;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #1f2937;
    }

    .sidebar-header h2 {
      font-size: 24px;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 12px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: #1f2937;
      color: white;
    }

    .chat-list {
      overflow-y: auto;
      flex: 1;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 20px;
      cursor: pointer;
      transition: 0.3s;
      border-bottom: 1px solid #1f2937;
    }

    .chat-item:hover {
      background: #1e293b;
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #3b82f6;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 18px;
    }

    .chat-info {
      flex: 1;
    }

    .chat-info h4 {
      margin-bottom: 5px;
    }

    .chat-info p {
      color: #94a3b8;
      font-size: 14px;
    }

    /* CHAT AREA */

    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0f172a;
    }

    .chat-header {
      height: 80px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      padding: 0 25px;
      gap: 15px;
    }

    .chat-header .avatar {
      width: 45px;
      height: 45px;
    }

    .chat-body {
      flex: 1;
      min-height: 0;
      padding: 25px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 15px;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      max-width: 350px;
      padding: 15px;
      border-radius: 15px;
      line-height: 1.5;
      font-size: 15px;
    }

    .sender {
      background: #2563eb;
      align-self: flex-end;
      border-bottom-right-radius: 5px;
    }

    .receiver {
      background: #1e293b;
      align-self: flex-start;
      border-bottom-left-radius: 5px;
    }

    .system {
      background: rgba(30, 41, 59, 0.4) !important;
      color: #94a3b8;
      font-style: italic;
      align-self: center;
      text-align: center;
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 13px;
      max-width: 80%;
      border-bottom-left-radius: 12px !important;
      border-bottom-right-radius: 12px !important;
    }

    /* INPUT */

    .chat-input {
      height: 90px;
      background: #111827;
      border-top: 1px solid #1f2937;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 0 20px;
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      height: 50px;
      border: none;
      outline: none;
      border-radius: 12px;
      padding: 0 20px;
      background: #1f2937;
      color: white;
      font-size: 16px;
    }

    .chat-input button {
      width: 120px;
      height: 50px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .chat-input button:hover {
      background: #1d4ed8;
    }

    /* LOGIN PAGE */

    .login-page {
      position: absolute;
      inset: 0;
      background: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .login-box {
      width: 400px;
      background: #111827;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-box input {
      width: 100%;
      height: 55px;
      margin-bottom: 20px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #1f2937;
      color: white;
      padding: 0 20px;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    /* ROOM JOIN OVERLAY SCREEN */
    .room-page {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .room-box {
      width: 380px;
      background: #111827;
      padding: 35px;
      border-radius: 20px;
      border: 1px solid #1f2937;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .room-box h3 {
      margin-bottom: 8px;
      font-size: 24px;
    }

    .room-box p {
      margin-bottom: 25px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
    }

    .room-box input {
      width: 100%;
      height: 50px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #1f2937;
      color: white;
      padding: 0 20px;
      margin-bottom: 20px;
      font-size: 15px;
      transition: 0.3s;
    }

    .room-box input:focus {
      border: 2px solid #2563eb;
      background: #111827;
    }

    .room-box button {
      width: 100%;
      height: 50px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .room-box button:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    /* ADMIN DASHBOARD */

    .admin-dashboard {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 300px;
      background: #111827;
      padding: 20px;
      border-radius: 15px;
      border: 1px solid #1f2937;
    }

    .admin-dashboard h3 {
      margin-bottom: 20px;
    }

    .stat {
      background: #1f2937;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .stat h2 {
      margin-bottom: 5px;
    }

    /* HAMBURGER BUTTON */
    .hamburger-btn {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      flex-direction: column;
      gap: 5px;
      padding: 6px;
      margin-right: 4px;
      flex-shrink: 0;
    }
    .hamburger-btn span {
      display: block;
      width: 22px;
      height: 2px;
      background: #94a3b8;
      border-radius: 2px;
      transition: 0.3s;
    }

    /* SIDEBAR BACKDROP */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 49;
      backdrop-filter: blur(2px);
    }
    .sidebar-backdrop.active { display: block; }

    /* ═══════════════════════════════════════
       LARGE DESKTOP (1280px+) — Default
       ═══════════════════════════════════════ */
    @media (min-width: 1280px) {
      .sidebar { width: 340px; }
      .chat-body { padding: 30px; }
      .message { max-width: 420px; font-size: 15px; }
      .chat-input { height: 90px; padding: 0 24px; }
      .chat-input input { height: 52px; font-size: 16px; }
      .chat-input button { width: 130px; height: 52px; font-size: 16px; }
    }

    /* ═══════════════════════════════════════
       SMALL DESKTOP / LAPTOP (1024px – 1279px)
       ═══════════════════════════════════════ */
    @media (min-width: 1024px) and (max-width: 1279px) {
      .sidebar { width: 280px; }
      .chat-body { padding: 20px; }
      .message { max-width: 380px; font-size: 15px; }
      .chat-input { height: 82px; padding: 0 20px; }
      .chat-input input { height: 48px; }
      .chat-input button { width: 110px; height: 48px; }
    }

    /* ═══════════════════════════════════════
       TABLET LANDSCAPE / SMALL LAPTOP (768px – 1023px)
       ═══════════════════════════════════════ */
    @media (min-width: 768px) and (max-width: 1023px) {
      .sidebar { width: 240px; }
      .sidebar-header h2 { font-size: 20px; }
      .chat-header { height: 70px; padding: 0 18px; }
      .chat-header .avatar { width: 40px; height: 40px; }
      .chat-body { padding: 18px; gap: 12px; }
      .message { max-width: 320px; font-size: 14px; }
      .chat-input { height: 76px; padding: 0 16px; gap: 12px; }
      .chat-input input { height: 46px; font-size: 15px; }
      .chat-input button { width: 100px; height: 46px; font-size: 15px; }
      .room-box { width: 360px; }
      .online-users-panel { margin: 0 14px 14px 14px; }
    }

    /* ═══════════════════════════════════════
       TABLET PORTRAIT / LARGE PHONE (480px – 767px)
       ═══════════════════════════════════════ */
    @media (max-width: 767px) {
      body { overflow: hidden; }
      .container { flex-direction: column; }

      .sidebar {
        position: fixed;
        top: 0; left: 0;
        height: 100vh;
        width: 290px;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.3s cubic-bezier(.4,0,.2,1);
        overflow-y: auto;
      }
      .sidebar.open { transform: translateX(0); }

      .chat-area { width: 100vw; height: 100vh; }

      .chat-header { height: 62px; padding: 0 14px; gap: 10px; }
      .chat-header .avatar { width: 38px; height: 38px; font-size: 14px; }
      .chat-header h3 { font-size: 15px; }
      .chat-header p { font-size: 12px; }

      .hamburger-btn { display: flex; }
      #terminateBtn { padding: 6px 10px; font-size: 12px; }

      .chat-body { padding: 14px; gap: 10px; }
      .message { max-width: 78vw; font-size: 14px; padding: 10px 14px; }

      .chat-input { height: 68px; padding: 0 12px; gap: 10px; }
      .chat-input input { height: 44px; font-size: 15px; padding: 0 14px; }
      .chat-input button { width: 80px; height: 44px; font-size: 14px; }

      .room-box { width: calc(100vw - 32px); padding: 26px 18px; border-radius: 16px; }
      .room-box h3 { font-size: 20px; }
      .room-box p { font-size: 13px; }
      .room-box input { height: 46px; font-size: 14px; }
      .room-box button { height: 46px; font-size: 15px; }

      .online-users-panel { margin: 0 14px 14px 14px; }
      .typing-bar { padding: 5px 14px; font-size: 12px; }

      .toast-container { top: 10px; right: 10px; left: 10px; }
      .toast { font-size: 13px; padding: 12px 16px; }
    }

    /* ═══════════════════════════════════════
       SMALL PHONE (max-width: 420px)
       ═══════════════════════════════════════ */
    @media (max-width: 420px) {
      .sidebar { width: 270px; }
      .sidebar-header { padding: 16px; }
      .sidebar-header h2 { font-size: 18px; }

      .chat-header { height: 56px; padding: 0 10px; gap: 8px; }
      .chat-header .avatar { width: 34px; height: 34px; font-size: 13px; }
      .chat-header h3 { font-size: 13px; }
      .chat-header p { font-size: 11px; display: none; }

      #terminateBtn { padding: 5px 8px; font-size: 11px; }

      .chat-body { padding: 10px; gap: 8px; }
      .message { max-width: 82vw; font-size: 13px; padding: 9px 12px; }
      .seen-tick { font-size: 10px; }

      .chat-input { height: 62px; padding: 0 10px; gap: 8px; }
      .chat-input input { height: 42px; font-size: 14px; padding: 0 12px; }
      .chat-input button { width: 68px; height: 42px; font-size: 13px; }

      .room-box { padding: 22px 14px; }
      .room-box h3 { font-size: 18px; margin-bottom: 6px; }
      .room-box p { font-size: 12px; margin-bottom: 18px; }
      .room-box input { height: 44px; margin-bottom: 14px; font-size: 14px; }
      .room-box button { height: 44px; font-size: 14px; }

      .toast { font-size: 12px; padding: 10px 14px; gap: 8px; }
      .typing-bar { font-size: 11px; }

      .online-user-item { font-size: 13px; }
      .online-avatar-sm { width: 24px; height: 24px; font-size: 11px; }
    }

    /* ═══════════════════════════════════════
       VERY SMALL PHONE (max-width: 320px)
       ═══════════════════════════════════════ */
    @media (max-width: 320px) {
      .sidebar { width: 250px; }
      .chat-input button { width: 58px; font-size: 12px; }
      .message { font-size: 12px; padding: 8px 10px; }
      .chat-header h3 { font-size: 12px; }
    }

    /* ═══════════════════════════════════════
       iQOO Z6 Lite 5G & similar (max 412px tall 20:9)
       dvh fix + safe-area-insets for notch/gesture bar
       ═══════════════════════════════════════ */
    @media (max-width: 412px) {
      body { height: 100dvh; }
      .container { height: 100dvh; }
      .chat-area { height: 100dvh; width: 100vw; }
      .sidebar { height: 100dvh; }

      .chat-input {
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        height: auto;
        min-height: 62px;
        padding-top: 10px;
        padding-left: 12px;
        padding-right: 12px;
        gap: 8px;
      }
      .chat-header {
        padding-top: max(0px, env(safe-area-inset-top));
      }
      .chat-input input {
        height: 42px;
        font-size: 15px;
        padding: 0 12px;
      }
      .chat-input button {
        width: 70px;
        height: 42px;
        font-size: 14px;
        flex-shrink: 0;
      }
      .message { max-width: 84vw; font-size: 13px; }
      .room-box {
        width: calc(100vw - 24px);
        padding: 24px 16px;
        margin: 0 12px;
      }
    }

    /* CUSTOM TOAST NOTIFICATION */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      background: rgba(17, 24, 39, 0.95);
      border-left: 5px solid #10b981;
      color: white;
      padding: 16px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(10px);
      transform: translateX(120%);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.show {
      transform: translateX(0);
    }

    .toast-icon {
      font-size: 20px;
    }

    .toast.error {
      border-left-color: #ef4444;
    }

    /* ONLINE USERS PANEL */
    .online-users-panel {
      margin: 0 20px 20px 20px;
      background: rgba(16, 185, 129, 0.05);
      border: 1px solid rgba(16, 185, 129, 0.15);
      border-radius: 15px;
      padding: 15px;
    }
    .online-users-panel h5 {
      font-size: 12px;
      font-weight: 700;
      color: #10b981;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .online-user-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 14px;
      color: #e2e8f0;
    }
    .online-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
      flex-shrink: 0;
    }
    .online-avatar-sm {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
    }

    /* TYPING INDICATOR */
    .typing-bar {
      padding: 6px 25px;
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #94a3b8;
      font-style: italic;
      background: #0f172a;
      border-bottom: 1px solid #1f2937;
    }
    .typing-dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .typing-dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3b82f6;
      animation: typingBounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* SEEN TICKS */
    .msg-wrapper {
      display: flex;
      flex-direction: column;
    }
    .msg-wrapper.sender-wrap { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.receiver-wrap { align-self: flex-start; align-items: flex-start; }
    .seen-tick {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
      transition: color 0.3s;
    }
    .seen-tick.seen { color: #3b82f6; }

    /* Attachment & Media Styles */
    .message img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 10px;
      display: block;
      margin-top: 5px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .message img:hover {
      transform: scale(1.02);
    }
    .message video {
      max-width: 100%;
      max-height: 250px;
      border-radius: 10px;
      display: block;
      margin-top: 5px;
    }
    .doc-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.08);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      max-width: 280px;
    }
    .receiver .doc-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid #1f2937;
    }
    .doc-card:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .receiver .doc-card:hover {
      background: rgba(15, 23, 42, 0.8);
    }
    .location-card {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      padding: 12px 14px;
      border-radius: 10px;
      margin-top: 5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      min-width: 200px;
    }
    .receiver .location-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid #1f2937;
    }
  </style>
</head>

<body>
  <!-- LOGIN REMOVED -->

  <!-- MAIN CHAT -->

  <div class="container">
    <!-- SIDEBAR -->

    <div class="sidebar">
      <div class="sidebar-header" style="border-bottom: 1px solid #1f2937; padding: 25px 20px;">
        <h2>💬 Chat Room</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-top: 5px;">Active Session</p>
      </div>

      <div class="chat-list" style="padding: 20px 20px 10px 20px;">
        <div
          style="background: rgba(37, 99, 235, 0.08); border: 1px solid rgba(37, 99, 235, 0.15); border-radius: 15px; padding: 20px; text-align: center; margin-bottom: 15px;">
          <div class="avatar" id="myAvatar"
            style="margin: 0 auto 15px auto; width: 60px; height: 60px; font-size: 24px; background: #2563eb; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 50%;">
            U</div>
          <h4 id="myProfileName" style="font-size: 18px; margin-bottom: 5px;">Username</h4>
          <span
            style="display: inline-flex; align-items: center; gap: 6px; background: rgba(16, 185, 129, 0.1); color: #10b981; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold;">
            <span style="width: 8px; height: 8px; background: #10b981; border-radius: 50%;"></span>
            Online
          </span>
        </div>
      </div>

      <!-- ONLINE USERS PANEL -->
      <div class="online-users-panel">
        <h5>🟢 Online Now</h5>
        <div id="onlineUsersList"><p style="color:#475569;font-size:13px;">Joining room...</p></div>
      </div>

      <!-- LOGOUT BUTTON -->
      <button onclick="handleLogout()"
        style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 12px; color: #f87171; padding: 12px; cursor: pointer; width: calc(100% - 40px); margin: 20px auto; font-weight: bold; text-align: center; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;"
        onmouseover="this.style.background='rgba(239, 68, 68, 0.2)'"
        onmouseout="this.style.background='rgba(239, 68, 68, 0.1)'">
        <span>Logout</span> 🚪
      </button>
    </div>

    <!-- CHAT AREA -->

    <div class="chat-area">
      <div class="chat-header">
        <!-- HAMBURGER (mobile only) -->
        <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Open menu">
          <span></span><span></span><span></span>
        </button>

        <div class="avatar" id="chatHeaderAvatar"
          style="background: #2563eb; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 50%;">
          R</div>

        <div>
          <h3 id="chatHeaderTitle">Room Chat</h3>
          <p id="chatHeaderSub">Waiting to join room...</p>
        </div>

        <!-- TERMINATE CHAT BUTTON (only shown to creator/host) -->
        <button id="terminateBtn" onclick="terminateRoom()"
          style="display: none; background: #ef4444; border: none; border-radius: 8px; color: white; padding: 8px 16px; font-weight: bold; cursor: pointer; margin-left: auto; transition: 0.3s;"
          onmouseover="this.style.background='#dc2626'" onmouseout="this.style.background='#ef4444'">
          Terminate Chat 🚫
        </button>
      </div>

      <!-- TYPING INDICATOR BAR -->
      <div class="typing-bar" id="typingBar" style="display:none;">
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span id="typingText">someone is typing...</span>
      </div>

      <div class="chat-body" id="chatBody">
      </div>

      <!-- INPUT -->

      <!-- Pending Attachment Preview Bar -->
      <div id="pendingPreviewBar" style="display:none; align-items:center; gap:10px; padding: 8px 16px; background:#111827; border-top:1px solid #1f2937; min-height:48px;">
        <div id="pendingPreviewContent" style="display:flex; align-items:center; gap:10px; flex:1; overflow:hidden;"></div>
        <button onclick="cancelPendingAttachment()" style="background:#ef4444; border:none; border-radius:8px; color:white; width:28px; height:28px; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0;">✕</button>
      </div>

      <div class="chat-input" style="position: relative;">
        <!-- Hidden File Inputs -->
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleFileSelected(this, 'image')" />
        <input type="file" id="videoInput" accept="video/*" style="display: none;" onchange="handleFileSelected(this, 'video')" />
        <input type="file" id="documentInput" accept="*" style="display: none;" onchange="handleFileSelected(this, 'document')" />

        <!-- Attachment Button -->
        <button id="attachBtn" onclick="toggleAttachmentMenu()" style="width: 50px; height: 50px; border-radius: 12px; background: #1f2937; color: #94a3b8; font-size: 20px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; flex-shrink: 0;">
          📎
        </button>

        <!-- Attachment Dropdown Menu -->
        <div id="attachmentMenu" style="display: none; position: absolute; bottom: 85px; left: 20px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 100; width: 180px; flex-direction: column; overflow: hidden; padding: 6px;">
          <button onclick="triggerFileInput('image')" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: transparent; border: none; color: white; width: 100%; text-align: left; cursor: pointer; font-size: 14px; border-radius: 8px; transition: 0.2s;" onmouseover="this.style.background='#1f2937'" onmouseout="this.style.background='transparent'">
            🖼️ Photo
          </button>
          <button onclick="triggerFileInput('video')" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: transparent; border: none; color: white; width: 100%; text-align: left; cursor: pointer; font-size: 14px; border-radius: 8px; transition: 0.2s;" onmouseover="this.style.background='#1f2937'" onmouseout="this.style.background='transparent'">
            🎥 Video
          </button>
          <button onclick="triggerFileInput('document')" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: transparent; border: none; color: white; width: 100%; text-align: left; cursor: pointer; font-size: 14px; border-radius: 8px; transition: 0.2s;" onmouseover="this.style.background='#1f2937'" onmouseout="this.style.background='transparent'">
            📄 Document
          </button>
          <button onclick="queueLocation()" style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: transparent; border: none; color: white; width: 100%; text-align: left; cursor: pointer; font-size: 14px; border-radius: 8px; transition: 0.2s;" onmouseover="this.style.background='#1f2937'" onmouseout="this.style.background='transparent'">
            📍 Share Location
          </button>
        </div>

        <input type="text" id="messageInput" placeholder="Type message..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- SIDEBAR BACKDROP (mobile) -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

  <!-- ROOM JOIN OVERLAY -->
  <div class="room-page" id="roomPage">
    <div class="room-box">
      <h3>Join Chat Room</h3>
      <p>Enter a Room ID to start chatting with your friends in real-time</p>
      <input type="text" id="roomId" placeholder="Room ID (e.g. Room101)" />
      <button onclick="joinRoom()">Join Room</button>
    </div>
  </div>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>



  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    // CONNECT BACKEND — dynamically matches whatever server is hosting the page
    const socket = io(window.location.origin);

    let currentRoom = "";
    let myUsername = sessionStorage.getItem("chatUsername") || "";
    if (!myUsername || myUsername === "undefined") {
      sessionStorage.removeItem("chatUsername");
      window.location.href = "/login";
    }

    // Initialize Sidebar User Card dynamically
    document.getElementById("myProfileName").innerText = myUsername;
    document.getElementById("myAvatar").innerText = myUsername.charAt(0).toUpperCase();

    let mySocketId = "";

    socket.on("connect", () => {
      mySocketId = socket.id;
    });

    // JOIN ROOM
    function joinRoom(savedRoomId) {
      const roomId = typeof savedRoomId === "string" ? savedRoomId : document.getElementById("roomId").value.trim();
      if (!roomId) { return; }
      currentRoom = roomId;

      // Save room ID to session storage to persist on page refresh
      sessionStorage.setItem("chatRoomId", roomId);

      // Emit object with roomId and username
      socket.emit("join_room", { roomId, username: myUsername });

      // Update header details to reflect joined room ID
      document.getElementById("chatHeaderTitle").innerText = `Room: ${roomId}`;
      document.getElementById("chatHeaderSub").innerText = "Active Session";
      document.getElementById("chatHeaderAvatar").innerText = roomId.charAt(0).toUpperCase();

      // Hide Room Overlay immediately to show Chat Screen
      document.getElementById("roomPage").style.display = "none";
    }

    let isAutojoin = false;

    // Auto-rejoin room if page is refreshed
    const savedRoom = sessionStorage.getItem("chatRoomId");
    if (savedRoom) {
      isAutojoin = true;
      joinRoom(savedRoom);
    }

    // ROOM PRIVILEGE STATUS (Host/Participant)
    socket.on("room_status", (data) => {
      const terminateBtn = document.getElementById("terminateBtn");
      if (data.isCreator) {
        terminateBtn.style.display = "block";
        if (!isAutojoin) {
          showToast("You created the room! You are the host. 👑", "success");
        }
      } else {
        terminateBtn.style.display = "none";
        if (!isAutojoin) {
          showToast("Successfully joined the room! 👋", "success");
        }
      }
      isAutojoin = false; // Reset after first auto-join
    });

    // JOIN ERROR CALLBACK (e.g. trying to join a different room in another tab)
    socket.on("join_error", (data) => {
      showToast(data.message, "error");
      
      // Reset room state
      currentRoom = "";
      sessionStorage.removeItem("chatRoomId");
      
      // Reset header details
      document.getElementById("chatHeaderTitle").innerText = "Room Chat";
      document.getElementById("chatHeaderSub").innerText = "Waiting to join room...";
      document.getElementById("chatHeaderAvatar").innerText = "R";
      
      // Re-show Room Overlay
      document.getElementById("roomPage").style.display = "flex";
    });

    // USER JOINED NOTIFICATION
    socket.on("user_joined", (data) => {
      appendMessage(data.message, "system");
    });

    // USER LEFT NOTIFICATION
    socket.on("user_left", (data) => {
      appendMessage(data.message, "system");
    });

    // LOAD PREVIOUS MESSAGES (Chat History)
    socket.on("previous_messages", (messages) => {
      // Clear current chat display to avoid duplicates
      document.getElementById("chatBody").innerHTML = "";

      messages.forEach((msg) => {
        if (msg.senderId === "system" || msg.senderName === "System") {
          appendMessage(msg.message, "system");
        } else {
          const bubbleType = msg.senderName === myUsername ? "sender" : "receiver";
          appendMessage(msg, bubbleType, msg.seen, msg.delivered);
        }
      });

      // Auto-emit seen if the user has loaded room history (meaning they see the messages now) and window is focused
      if (currentRoom && document.hasFocus()) {
        socket.emit("message_seen", { roomId: currentRoom, seenBy: myUsername });
      }
    });

    // ROOM TERMINATED BY HOST CALLBACK — Logout session and redirect
    socket.on("room_terminated", (data) => {
      showToast(`${data.message} Logging you out... 🚪`, "error");

      // Clear active user session
      sessionStorage.clear();

      // Redirect to Login Screen after 1.5s delay
      setTimeout(() => {
        window.location.href = "/login";
      }, 1500);
    });

    // TERMINATE ROOM
    function terminateRoom() {
      if (!currentRoom) return;
      socket.emit("terminate_room", currentRoom);
    }

    // LOGOUT ROUTINE
    function handleLogout() {
      sessionStorage.clear();
      window.location.href = "/login";
    }

    // ── TYPING INDICATOR ──────────────────────────────────────────
    let typingTimer = null;

    document.getElementById("messageInput").addEventListener("input", () => {
      if (!currentRoom) return;
      socket.emit("typing", { roomId: currentRoom, username: myUsername });
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        socket.emit("stop_typing", { roomId: currentRoom });
      }, 1500);
    });

    socket.on("user_typing", ({ username }) => {
      if (username === myUsername) return; // Suppress typing indicator for own user on other tabs/devices
      document.getElementById("typingText").innerText = `${username} is typing...`;
      document.getElementById("typingBar").style.display = "flex";
    });

    socket.on("user_stop_typing", () => {
      document.getElementById("typingBar").style.display = "none";
    });

    // ── ONLINE USERS ──────────────────────────────────────────────
    socket.on("online_users", (users) => {
      const list = document.getElementById("onlineUsersList");
      if (!list) return;
      if (users.length === 0) {
        list.innerHTML = `<p style="color:#475569;font-size:13px;">No users online</p>`;
        return;
      }
      list.innerHTML = users.map(u => `
        <div class="online-user-item">
          <div class="online-avatar-sm">${u.charAt(0).toUpperCase()}</div>
          <span>${u}</span>
          <div class="online-dot" style="margin-left:auto;"></div>
        </div>
      `).join("");
    });

    // ── PENDING ATTACHMENT STATE ───────────────────────────────────
    // Stores queued attachment: { type, file, fileUrl, fileName, fileSize, location }
    let pendingAttachment = null;

    function showPendingPreview(label, icon) {
      const bar = document.getElementById("pendingPreviewBar");
      const content = document.getElementById("pendingPreviewContent");
      content.innerHTML = `
        <span style="font-size:22px;">${icon}</span>
        <span style="font-size:13px; color:#e2e8f0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; flex:1;">${label}</span>
        <span style="font-size:11px; color:#64748b; flex-shrink:0;">Press Send to share</span>
      `;
      bar.style.display = "flex";
    }

    function cancelPendingAttachment() {
      pendingAttachment = null;
      document.getElementById("pendingPreviewBar").style.display = "none";
      document.getElementById("pendingPreviewContent").innerHTML = "";
      // Reset file inputs
      ["imageInput", "videoInput", "documentInput"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = "";
      });
    }

    // ── SEND MESSAGE ──────────────────────────────────────────────
    async function sendMessage() {
      const messageInput = document.getElementById("messageInput");
      const message = messageInput.value.trim();

      // Must have text OR a pending attachment
      if (!message && !pendingAttachment) return;
      if (!currentRoom) { showToast("Please join a room first!", "error"); return; }

      // Stop typing indicator
      clearTimeout(typingTimer);
      socket.emit("stop_typing", { roomId: currentRoom });

      // ── Case 1: pending file attachment ─────────────────────────
      if (pendingAttachment && pendingAttachment.type !== "location") {
        const { type, file } = pendingAttachment;

        const formData = new FormData();
        formData.append("file", file);

        try {
          const response = await fetch("/api/upload", { method: "POST", body: formData });
          if (!response.ok) throw new Error("Upload failed");

          const result = await response.json();
          if (result.success) {
            const msgObj = {
              roomId: currentRoom,
              message: message,          // optional caption
              messageType: type,
              fileUrl: result.fileUrl,
              fileName: result.fileName,
              fileSize: result.fileSize,
              senderName: myUsername
            };
            socket.emit("send_message", msgObj);
            appendMessage(msgObj, "sender", false, false);
          } else {
            showToast("Upload failed!", "error");
          }
        } catch (err) {
          console.error("Upload error:", err);
          showToast("Failed to upload. Please try again.", "error");
        }

        cancelPendingAttachment();
        messageInput.value = "";
        return;
      }

      // ── Case 2: pending location attachment ──────────────────────
      if (pendingAttachment && pendingAttachment.type === "location") {
        const { lat, lng } = pendingAttachment;
        const msgObj = {
          roomId: currentRoom,
          message: `Location: ${lat.toFixed(6)}, ${lng.toFixed(6)}`,
          messageType: "location",
          location: { latitude: lat, longitude: lng, address: "" },
          senderName: myUsername
        };
        socket.emit("send_message", msgObj);
        appendMessage(msgObj, "sender", false, false);
        cancelPendingAttachment();
        messageInput.value = "";
        return;
      }

      // ── Case 3: plain text message ───────────────────────────────
      const msgObj = {
        roomId: currentRoom,
        message: message,
        messageType: "text",
        senderName: myUsername,
      };
      socket.emit("send_message", msgObj);
      appendMessage(msgObj, "sender", false, false);
      messageInput.value = "";
    }

    // Allow Enter key to send
    document.getElementById("messageInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    // ── SEEN STATUS ───────────────────────────────────────────────
    // When chat body is scrolled to bottom (receiver reads), emit seen if document is focused
    const chatBodyEl = document.getElementById("chatBody");
    chatBodyEl.addEventListener("scroll", () => {
      if (!currentRoom) return;
      const atBottom = chatBodyEl.scrollHeight - chatBodyEl.scrollTop - chatBodyEl.clientHeight < 50;
      if (atBottom && document.hasFocus()) {
        socket.emit("message_seen", { roomId: currentRoom, seenBy: myUsername });
      }
    });

    // Also emit seen when window gets focus, if we are at the bottom of the chat
    window.addEventListener("focus", () => {
      if (!currentRoom) return;
      const atBottom = chatBodyEl.scrollHeight - chatBodyEl.scrollTop - chatBodyEl.clientHeight < 50;
      if (atBottom) {
        socket.emit("message_seen", { roomId: currentRoom, seenBy: myUsername });
      }
    });

    // Emit seen on user interaction/click inside the message input or chat area
    document.getElementById("messageInput").addEventListener("click", () => {
      if (!currentRoom) return;
      const atBottom = chatBodyEl.scrollHeight - chatBodyEl.scrollTop - chatBodyEl.clientHeight < 50;
      if (atBottom) {
        socket.emit("message_seen", { roomId: currentRoom, seenBy: myUsername });
      }
    });

    chatBodyEl.addEventListener("click", () => {
      if (!currentRoom) return;
      const atBottom = chatBodyEl.scrollHeight - chatBodyEl.scrollTop - chatBodyEl.clientHeight < 50;
      if (atBottom) {
        socket.emit("message_seen", { roomId: currentRoom, seenBy: myUsername });
      }
    });

    // When sender receives seen confirmation → turn all ticks blue
    socket.on("messages_seen", ({ seenBy }) => {
      if (seenBy === myUsername) return; // Ignore own read receipts from other tabs
      document.querySelectorAll(".seen-tick").forEach(tick => {
        tick.classList.add("seen");
        tick.title = `Seen by ${seenBy}`;
      });
    });

    // When messages are delivered to other users in the room, upgrade all single ticks to double ticks
    socket.on("messages_delivered", () => {
      document.querySelectorAll(".seen-tick").forEach(tick => {
        if (tick.innerText === "✓ Sent") {
          tick.innerText = "✓✓ Delivered";
        }
      });
    });

    // RECEIVE MESSAGE from others
    socket.on("receive_message", (data) => {
      // If this is the echo of our own message, update its delivery and seen status
      if (data.senderId === socket.id) {
        if (data.delivered) {
          const ticks = document.querySelectorAll(".seen-tick");
          if (ticks.length > 0) {
            const lastTick = ticks[ticks.length - 1];
            lastTick.innerText = "✓✓ Delivered";
            if (data.seen) {
              lastTick.classList.add("seen");
            }
          }
        }
        return;
      }
      
      // If the message is sent by the same user on another tab/device, style it as sender (right side)
      const bubbleType = data.senderName === myUsername ? "sender" : "receiver";
      appendMessage(data, bubbleType, data.seen, data.delivered);
    });

    // ── ATTACHMENT FLOWS ──────────────────────────────────────────
    function toggleAttachmentMenu() {
      const menu = document.getElementById("attachmentMenu");
      if (menu.style.display === "flex") {
        menu.style.display = "none";
      } else {
        menu.style.display = "flex";
      }
    }

    // Hide attachment menu when clicking outside
    document.addEventListener("click", (e) => {
      const menu = document.getElementById("attachmentMenu");
      const attachBtn = document.getElementById("attachBtn");
      if (menu && attachBtn && !menu.contains(e.target) && !attachBtn.contains(e.target)) {
        menu.style.display = "none";
      }
    });

    function triggerFileInput(type) {
      toggleAttachmentMenu(); // Hide menu
      if (type === 'image') document.getElementById('imageInput').click();
      else if (type === 'video') document.getElementById('videoInput').click();
      else if (type === 'document') document.getElementById('documentInput').click();
    }

    // Queue a file for sending (does NOT upload yet)
    function handleFileSelected(input, type) {
      const file = input.files[0];
      if (!file) return;

      const icons = { image: "🖼️", video: "🎥", document: "📄" };
      const label = file.name + (file.size ? " (" + formatBytes(file.size) + ")" : "");

      pendingAttachment = { type, file };
      showPendingPreview(label, icons[type] || "📎");
      document.getElementById("messageInput").focus();
    }

    // ── GEOLOCATION SHARING ───────────────────────────────────────
    // Queue a location for sending (does NOT send yet)
    function queueLocation() {
      toggleAttachmentMenu(); // Hide menu

      if (!navigator.geolocation) {
        showToast("Geolocation is not supported by your browser", "error");
        return;
      }

      showToast("Fetching your location... 📍", "success");

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          pendingAttachment = { type: "location", lat, lng };
          showPendingPreview(`${lat.toFixed(5)}, ${lng.toFixed(5)}`, "📍");
          document.getElementById("messageInput").focus();
        },
        (error) => {
          showToast(`Unable to retrieve location: ${error.message}`, "error");
        }
      );
    }

    // Helper to format file sizes
    function formatBytes(bytes, decimals = 2) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const dm = decimals < 0 ? 0 : decimals;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    // ── APPEND MESSAGE ────────────────────────────────────────────
    function appendMessage(msgInput, bubbleType, seen = false, delivered = false) {
      const chatBody = document.getElementById("chatBody");
      const wrapper = document.createElement("div");
      wrapper.classList.add("msg-wrapper", bubbleType === "sender" ? "sender-wrap" : "receiver-wrap");

      const div = document.createElement("div");
      div.classList.add("message", bubbleType);

      // If system message
      if (bubbleType === "system") {
        div.innerText = typeof msgInput === "string" ? msgInput : msgInput.message;
        wrapper.appendChild(div);
        chatBody.appendChild(wrapper);
        chatBody.scrollTop = chatBody.scrollHeight;
        return;
      }

      // Convert raw text strings if needed
      let msgObj = msgInput;
      if (typeof msgInput === "string") {
        msgObj = {
          message: msgInput,
          messageType: "text"
        };
      }

      const type = msgObj.messageType || "text";

      // Header showing sender name (only for receiver bubbles)
      if (bubbleType === "receiver" && msgObj.senderName) {
        const senderSpan = document.createElement("div");
        senderSpan.style.fontWeight = "bold";
        senderSpan.style.fontSize = "12px";
        senderSpan.style.color = "#3b82f6";
        senderSpan.style.marginBottom = "5px";
        senderSpan.innerText = msgObj.senderName;
        div.appendChild(senderSpan);
      }

      if (type === "text") {
        const textSpan = document.createElement("span");
        textSpan.innerText = msgObj.message;
        div.appendChild(textSpan);
      } else if (type === "image") {
        const img = document.createElement("img");
        img.src = msgObj.fileUrl;
        img.alt = "Sent image";
        img.onclick = () => window.open(msgObj.fileUrl, "_blank");
        div.appendChild(img);

        if (msgObj.message) {
          const caption = document.createElement("div");
          caption.style.marginTop = "8px";
          caption.innerText = msgObj.message;
          div.appendChild(caption);
        }
      } else if (type === "video") {
        const video = document.createElement("video");
        video.src = msgObj.fileUrl;
        video.controls = true;
        div.appendChild(video);

        if (msgObj.message) {
          const caption = document.createElement("div");
          caption.style.marginTop = "8px";
          caption.innerText = msgObj.message;
          div.appendChild(caption);
        }
      } else if (type === "document") {
        const docCard = document.createElement("div");
        docCard.classList.add("doc-card");
        docCard.onclick = () => window.open(msgObj.fileUrl, "_blank");

        const icon = document.createElement("span");
        icon.innerText = "📄";
        icon.style.fontSize = "22px";
        docCard.appendChild(icon);

        const info = document.createElement("div");
        info.style.overflow = "hidden";

        const name = document.createElement("div");
        name.innerText = msgObj.fileName || "Document";
        name.style.fontWeight = "bold";
        name.style.whiteSpace = "nowrap";
        name.style.textOverflow = "ellipsis";
        name.style.overflow = "hidden";
        name.style.fontSize = "14px";
        info.appendChild(name);

        if (msgObj.fileSize) {
          const size = document.createElement("div");
          size.innerText = formatBytes(msgObj.fileSize);
          size.style.fontSize = "11px";
          size.style.color = "#94a3b8";
          info.appendChild(size);
        }
        docCard.appendChild(info);
        div.appendChild(docCard);
      } else if (type === "location") {
        const locCard = document.createElement("div");
        locCard.classList.add("location-card");

        const header = document.createElement("div");
        header.style.display = "flex";
        header.style.alignItems = "center";
        header.style.gap = "8px";
        header.style.fontWeight = "bold";
        header.style.fontSize = "14px";
        header.innerText = "📍 Location Shared";
        locCard.appendChild(header);

        const latLng = document.createElement("div");
        latLng.style.fontSize = "12px";
        latLng.style.color = "#cbd5e1";
        const lat = msgObj.location?.latitude;
        const lng = msgObj.location?.longitude;
        latLng.innerText = `Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`;
        locCard.appendChild(latLng);

        const mapLink = document.createElement("a");
        mapLink.href = `https://www.google.com/maps?q=${lat},${lng}`;
        mapLink.target = "_blank";
        mapLink.innerText = "View on Google Maps";
        mapLink.style.color = bubbleType === "sender" ? "#60a5fa" : "#3b82f6";
        mapLink.style.textDecoration = "none";
        mapLink.style.fontWeight = "bold";
        mapLink.style.fontSize = "13px";
        mapLink.style.marginTop = "4px";
        mapLink.style.display = "inline-block";

        mapLink.onmouseover = () => mapLink.style.textDecoration = "underline";
        mapLink.onmouseout = () => mapLink.style.textDecoration = "none";

        locCard.appendChild(mapLink);
        div.appendChild(locCard);
      }

      wrapper.appendChild(div);

      // Add seen tick only for own sent messages
      if (bubbleType === "sender") {
        const tick = document.createElement("span");
        tick.classList.add("seen-tick");
        if (seen) {
          tick.classList.add("seen");
          tick.title = "Seen";
          tick.innerText = "✓✓ Delivered";
        } else if (delivered) {
          tick.innerText = "✓✓ Delivered";
        } else {
          tick.innerText = "✓ Sent";
        }
        wrapper.appendChild(tick);
      }

      chatBody.appendChild(wrapper);
      chatBody.scrollTop = chatBody.scrollHeight;
    }

    // PREMIUM DYNAMIC TOAST SYSTEM
    function showToast(message, type = "success") {
      const container = document.getElementById("toastContainer");
      if (!container) return;

      const toast = document.createElement("div");
      toast.className = `toast ${type}`;

      const icon = type === "success" ? "✨" : "🚫";
      toast.innerHTML = `<span class="toast-icon">${icon}</span><span>${message}</span>`;

      container.appendChild(toast);

      // Trigger smooth entry animation
      setTimeout(() => {
        toast.classList.add("show");
      }, 10);

      // Auto-remove toast
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => {
          toast.remove();
        }, 400);
      }, 3500);
    }
  </script>
</body>

  <script>
    // MOBILE SIDEBAR TOGGLE
    function toggleSidebar() {
      const sidebar = document.querySelector('.sidebar');
      const backdrop = document.getElementById('sidebarBackdrop');
      sidebar.classList.toggle('open');
      backdrop.classList.toggle('active');
    }
  </script>
